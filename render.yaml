services:
  - type: web
    name: crochet-pattern-gen
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAVELRY_USERNAME
        sync: false
      - key: RAVELRY_PASSWORD
        sync: false
